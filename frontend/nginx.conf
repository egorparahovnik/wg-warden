# Клиентский IP берём из X-Real-IP только когда запрос пришёл от Caddy
# (статический адрес в docker-compose.tls.yml). В локальном и VPS-режиме
# без Caddy заголовок от клиента не принимается вообще.
set_real_ip_from 172.28.0.10;
real_ip_header X-Real-IP;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=wg_warden_auth:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    root /usr/share/nginx/html;
    index index.html;

    location /api/auth/ {
        limit_req zone=wg_warden_auth burst=5 nodelay;
        proxy_pass http://app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr уже учитывает realip от доверенного Caddy.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Наружу отдаём только health-check, а не все actuator-эндпоинты.
    location = /actuator/health {
        proxy_pass http://app:8081/actuator/health;
        proxy_set_header Host $host;
    }

    location /actuator/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
