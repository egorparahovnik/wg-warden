services:
  db:
    image: postgres:16-alpine
    container_name: wgmanager-db
    environment:
      POSTGRES_DB: wgmanager
      POSTGRES_USER: wgmanager
      POSTGRES_PASSWORD: wgmanager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wgmanager"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
