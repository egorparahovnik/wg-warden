# Панель может стоять за TLS-прокси (Caddy): сохраняем присланные им адрес и схему,
# иначе rate-limit считал бы всех клиентов одним IP прокси.
map $http_x_real_ip $wg_warden_client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

map $http_x_forwarded_proto $wg_warden_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $wg_warden_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $wg_warden_proto;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /actuator/ {
        proxy_pass http://app:8081;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
