spring:
  application:
    name: wg-warden
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wgwarden}
    username: ${DB_USER:wgwarden}
    password: ${DB_PASSWORD:?DB_PASSWORD is required}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # схему ведёт только Flyway
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true        # виртуальные потоки Java 21

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  master-key: ${APP_MASTER_KEY}   # 32 байта в base64, хранится вне БД
  jwt-secret: ${JWT_SECRET}
  jwt-expiration: 24h
  monitoring:
    retention: ${MONITORING_RETENTION:30d}
    interval: ${MONITORING_INTERVAL:60s}
